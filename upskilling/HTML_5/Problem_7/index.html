<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Invite</title>

    <script>

        // Video ready message
        function videoReady() {
            document.getElementById("message").innerHTML =
                "Video ready to play";
        }

        // Warn before leaving page
        window.onbeforeunload = function () {
            return "Your form is not completed. Are you sure?";
        };

    </script>
</head>
<body>

    <h1>Community Event Promo</h1>

    <video width="500"
           controls
           oncanplay="videoReady()">

        <source src="promo.mp4" type="video/mp4">

        Your browser does not support video.
    </video>

    <p id="message"></p>

</body>
</html>
